[project]
name = "strava"
version = "0.1.0"
description = ""
authors = [
    {name = "demirbilek95",email = "dogancandemirbilek@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "plotly (>=6.3.1,<7.0.0)",
    "streamlit (>=1.50.0,<2.0.0)",
    "folium (>=0.15.0,<1.0.0)",
    "streamlit-folium (>=0.13.0,<1.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "watchdog (>=6.0.0,<7.0.0)",
    "google-genai (>=0.4.0,<0.5.0)",
    "libsql-experimental (>=0.0.50,<1.0.0)",
    "cryptography (>=42.0.0,<44.0.0)",
    "setuptools (>=82.0.1,<83.0.0)",
    "pyarrow (>=22.0.0,<24.0.0)"
]

[dependency-groups]
dev = [
    "ipython (>=9.6.0,<10.0.0)",
    "ipykernel (>=7.0.1,<8.0.0)",
    "pylint (>=4.0.4,<5.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=25.12.0,<26.0.0)",
    "pytest (>=9.0.2,<10.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
  | data
  | notebooks
)/
'''

[tool.pytest.ini_options]
pythonpath = ["src", "src/strava"]
testpaths = ["tests"]